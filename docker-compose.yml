# B-05 — one command:   npm run docker   (finds the suite folder for you)
#                  or:  SUITE_DIR=../offenderwatch-qa-suite docker compose up --build
# Then open http://localhost:5080
services:
  platform:
    build:
      context: .                                # this platform folder — its name does not matter
      additional_contexts:
        suite: ${SUITE_DIR:-../SuperCom}       # the Part 3 suite (npm run docker sets SUITE_DIR automatically)
    ports:
      - "5080:5080"
    volumes:
      # Own named volume: the container never shares a SQLite file with a platform running on the host.
      - platform-data:/data
    restart: unless-stopped

volumes:
  platform-data:
